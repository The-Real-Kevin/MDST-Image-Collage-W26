# Image Collage Generator Configuration

# Source images
source_images:
  directory: "data/source_images"
  supported_formats: [".jpg", ".jpeg", ".png", ".webp"]
  cache_file: "cache/source_images.json"

# Target images
target_images:
  directory: "data/target_images"

# Collage settings
collage:
  # Grid dimensions (number of segments, not pixel size)
  grid_segments_x: 15  # Number of columns
  grid_segments_y: 20  # Number of rows
  output_directory: "output/collages"
  # Max times any single source image can be reused. Set to null for no limit.
  max_uses_per_image: 3
  # Spatial repulsion strength. Penalises placing the same image in nearby tiles.
  # 0 = pure colour matching, ~30-80 = balanced, higher = more spread.
  diversity_strength: 50
  # Radius (in tiles) to look for neighbours when computing the repulsion penalty.
  neighbor_radius: 3

# Performance
performance:
  use_multiprocessing: false
  num_workers: 4